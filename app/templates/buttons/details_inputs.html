<div class="dropdown">
    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
        aria-expanded="false" data-bs-popper-config='{"strategy":"fixed"}'>
        <i class="bi bi-list"></i> Opcje
    </button>

    <ul class="dropdown-menu shadow" hx-target="#details-container-{{ unique_id }}" hx-swap="beforeend">

        {% for key, label in [('distance', 'Dystans'), ('time', 'Czas'), ('quantity', 'Powtórzenia'), ('weight',
        'Ciężar')] %}
        <li>
            <button class="dropdown-item" type="button" hx-get="/input?type={{ key }}">
                {{ label }}
            </button>
        </li>
        {% endfor %}
    </ul>
</div>
