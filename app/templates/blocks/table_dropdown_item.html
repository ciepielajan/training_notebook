<div class="dropdown w-100 h-100 d-flex align-items-center me-1">

    <button class="btn btn-sm text-start flex-grow-1 border-0 shadow-none p-0 text-truncate" type="button"
        data-bs-toggle="dropdown" aria-expanded="false" data-bs-popper-config='{"strategy":"fixed"}'
        style="outline: none;">
        <span class="item-name fw-medium" style="font-size: 14px;">
            {{ cell_val if cell_val else 'Wybierz...' }}
        </span>
    </button>

    <input type="hidden" name="r{{ r }}c{{ c }}" class="item-value-input" value="{{ cell_val }}">
    <input type="hidden" name="r{{ r }}c{{ c }}_id" class="item-id-input"
        value="{{ data['r' ~ r ~ 'c' ~ c ~ '_id'] | default('') }}">

    <ul class="dropdown-menu shadow-sm" style="min-width: 260px; z-index: 1050;">

        <li>
            <h6 class="dropdown-header">Systemowe</h6>
        </li>
        {% for item_id, item_name in SETTINGS.get('database', {}).get('system_items', {}).items() %}
        <li>
            <button class="dropdown-item d-flex align-items-center py-2" type="button"
                onclick="selectItem(this, '{{ item_id }}', '{{ item_name }}')">
                <i class="bi bi-heptagon-half me-2 text-primary"></i> {{ item_name }}
            </button>
        </li>
        {% endfor %}

        <li>
            <hr class="dropdown-divider">
        </li>

        <li>
            <h6 class="dropdown-header">Twoje własne</h6>
        </li>
        {% for item_id, item_name in SETTINGS.get('database', {}).get('user_items', {}).items() %}
        <li>
            <button class="dropdown-item d-flex align-items-center py-2" type="button"
                onclick="selectItem(this, '{{ item_id }}', '{{ item_name }}')">
                <i class="bi bi-person-fill me-2 text-success"></i> {{ item_name }}
            </button>
        </li>
        {% endfor %}

        <li>
            <hr class="dropdown-divider">
        </li>
        <li>
            <button class="dropdown-item text-primary fw-bold mt-1" type="button">
                <i class="bi bi-plus-circle me-1"></i> Dodaj nowe...
            </button>
        </li>
    </ul>
</div>
