<div class="alert alert-warning border border-warning-subtle shadow-sm mb-0 p-3">
    <div class="d-flex align-items-center mb-2">
        <i class="bi bi-exclamation-triangle-fill text-warning fs-4 me-3"></i>
        <div>
            <h6 class="mb-0 fw-bold">Nieobsługiwany blok: <span class="badge bg-warning text-dark">{{ data.original_type }}</span></h6>
            <small class="text-secondary">Wersja aplikacji nie rozpoznaje tego elementu. Jego ukryta struktura została bezpiecznie zachowana.</small>
        </div>
    </div>

    <input type="hidden" name="type" value="deprecated">
    <input type="hidden" name="original_type" value="{{ data.original_type }}">
    <input type="hidden" name="raw_data" value="{{ data.raw_data }}">
</div>
