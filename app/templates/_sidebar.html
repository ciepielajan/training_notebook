<nav id="sidebar" class="sidebar collapsed">

    <div class="mt-3 mb-2">
        <button id="hamburger-btn" class="toggle-btn shadow-none">
            <i class="bi bi-list"></i>
        </button>
    </div>

    <div class="mb-2">
        <a href="#" class="nav-link">
            <i class="bi bi-plus-lg"></i>
            <span class="menu-text">Nowy trening</span>
        </a>
    </div>

    <div class="mb-2">
        <form id="sidebar-upload-form" hx-post="/load" hx-target="#fields-container" hx-swap="innerHTML"
            enctype="multipart/form-data" style="display: none;">
            <input type="file" id="sidebar-file-input" name="file" accept=".json">
            <button type="submit" id="sidebar-submit-btn"></button>
        </form>

        <a href="#" class="nav-link" id="sidebar-import-btn">
            <i class="bi bi-upload"></i>
            <span class="menu-text">Import</span>
        </a>
    </div>

    <div class="mb-2">
        <a href="#" class="nav-link text-success" id="sidebar-save-btn">
            <i class="bi bi-floppy"></i>
            <span class="menu-text">Zapisz</span>
        </a>
    </div>

    <div class="recent-workouts-container mt-2">
        <div class="sidebar-heading menu-text">
            Ostatnie
        </div>

        <ul class="list-unstyled mb-0">
            {% if recent_workouts %}
            {% for workout in recent_workouts %}
            <li>
                <a href="#" class="nav-link" hx-get="/load_workout/{{ workout.filename }}"
                    hx-target="#fields-container">
                    <i class="bi bi-chat-left-text"></i>
                    <span class="menu-text">{{ workout.name }}</span>
                </a>
            </li>
            {% endfor %}
            {% else %}
            <li>
                <a href="#" class="nav-link pe-none" style="color: #8e8e8e;">
                    <i class="bi bi-info-circle"></i>
                    <span class="menu-text fst-italic">Brak treningów</span>
                </a>
            </li>
            {% endif %}
        </ul>
    </div>

    <div class="mt-auto mb-4 border-top border-secondary pt-2" style="border-color: #3c3f43 !important;">
        <a href="#" class="nav-link">
            <i class="bi bi-gear"></i>
            <span class="menu-text">Ustawienia</span>
        </a>
    </div>
</nav>
