{% include "_header.html" %}

<div id="fields-container" class="container px-0">
    {% include "_cards_list.html" %}
</div>

<div id="bulk-action-bar" class="position-fixed bottom-0 start-50 translate-middle-x mb-4 shadow rounded-pill bg-white border border-secondary-subtle px-4 py-2 d-none align-items-center gap-3 z-3">
    <span class="fw-bold text-primary"><span id="selected-count">1</span> zaznaczono</span>
    <div class="vr"></div>
    <button type="button" class="btn btn-sm btn-light text-secondary fw-medium" onclick="exitSelectionMode()">Anuluj</button>
    <button type="button" class="btn btn-sm btn-outline-danger" disabled><i class="bi bi-trash"></i> Usuń</button>
    <button type="button" class="btn btn-sm btn-outline-secondary" disabled><i class="bi bi-copy"></i> Kopiuj</button>
</div>

<input type="hidden" name="json_body" id="hidden-json-input">
<input type="hidden" name="save_action" id="hidden-save-action" value="save">
