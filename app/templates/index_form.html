<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test styli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=1">
    <!-- HTMX (CDN) - bardzo mała biblioteka -->
    <script src="https://unpkg.com/htmx.org"></script>
</head>

<body class="p-4">
    <div class="mb-4 p-3 border rounded bg-light">
        <h5>Wczytaj trening</h5>
        <form hx-post="/load" hx-target="#fields-container" hx-swap="innerHTML" enctype="multipart/form-data">

            <div class="input-group">
                <input type="file" class="form-control" name="file" accept=".json" required>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-upload"></i> Wczytaj JSON
                </button>
            </div>
        </form>
    </div>

    <hr>

    <form id="form" action="/save" method="post">

        <div id="fields-container" class="container node">
            {% for card in cards_list %}
            {% with type=card.type, unique_id=card.unique_id, data=card.data, options=card.options %}
            {% include "_card.html" %}
            {% endwith %}
            {% endfor %}
        </div>

        <input type="hidden" name="json_body" id="hidden-json-input">

        <div class="mt-4">
            <button type="submit" class="btn btn-success btn-lg">Zapisz cały trening</button>
        </div>
    </form>

    <script>
        function htmlTreeToJson(element) {
            let data = {};
            let items = [];

            // KROK 1: Zbieramy dane (inputy)
            const allInputs = element.querySelectorAll('input, select, textarea');

            allInputs.forEach(input => {
                const ownerNode = input.closest('.node');
                if (ownerNode === element) {
                    if (input.name && input.name !== 'json_body') {
                        data[input.name] = input.value;
                    }
                }
            });

            // KROK 2: Szukamy dzieci
            const allNodes = element.querySelectorAll('.node');

            allNodes.forEach(node => {
                const parentNode = node.parentElement.closest('.node');
                if (parentNode === element) {
                    items.push(htmlTreeToJson(node));
                }
            });

            // KROK 3: Zapisujemy dzieci pod odpowiednią nazwą
            if (items.length > 0) {
                // NOWOŚĆ: Sprawdzamy czy w HTML zdefiniowano nazwę klucza dla dzieci.
                // Jeśli nie, domyślnie używamy 'items'.
                let keyName = element.dataset.childrenKey || 'items';

                data[keyName] = items;
            }

            return data;
        }

        // Obsługa submit (bez zmian)
        document.getElementById('form').addEventListener('submit', function (e) {
            const rootElement = document.getElementById('fields-container');
            const structure = htmlTreeToJson(rootElement);
            const jsonString = JSON.stringify(structure);
            document.getElementById('hidden-json-input').value = jsonString;
            console.log("WYGENEROWANY JSON:", JSON.stringify(structure, null, 2));

        });

        document.body.addEventListener('htmx:configRequest', function (evt) {
            if (evt.detail.path.includes('/card/repetition/')) {
                const rootElement = document.getElementById('fields-container');
                const structure = htmlTreeToJson(rootElement);
                // Wysyłamy cały JSON, tak jak przy zapisie
                evt.detail.parameters['json_body'] = JSON.stringify(structure);
            }
        });
    </script>
</body>

</html>
