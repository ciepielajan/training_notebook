<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test styli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=1">
    <!-- HTMX (CDN) - bardzo mała biblioteka -->
    <script src="https://unpkg.com/htmx.org"></script>
</head>

<body class="p-4">
    <div class="mb-4 p-3 border rounded bg-light">
        <h5>Wczytaj trening</h5>
        <form hx-post="/load" hx-target="#fields-container" hx-swap="innerHTML" enctype="multipart/form-data">

            <div class="input-group">
                <input type="file" class="form-control" name="file" accept=".json" required>
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-upload"></i> Wczytaj JSON
                </button>
            </div>
        </form>
    </div>

    <hr>

    <form id="form" action="/save" method="post">

        <div id="fields-container" class="container">
        {% for card in cards_list %}
            {% with type=card.type, unique_id=card.unique_id, data=card.data, options=card.options %}
                {% include "_card.html" %}
            {% endwith %}
        {% endfor %}
        </div>

        <div class="container controls mt-3" hx-target="#fields-container" hx-swap="beforeend">
            <button type="button" class="btn btn-outline-secondary" hx-get="/card?type=running&value=Sprint_z_przycisku&label=aktywnosc">
                + Bieganie
            </button>
            <button type="button" class="btn btn-outline-secondary" hx-get="/card?type=exercise&label=ćwiczenie">
                + Ćwiczenie
            </button>
            <button type="button" class="btn btn-outline-secondary" hx-get="/card?type=gym">
                + Siłownia
            </button>
            <button type="button" class="btn btn-outline-secondary" 
                    hx-get="/card?type=text&size=fs-1">
                + Nagłówek H1
            </button>

            <button type="button" class="btn btn-outline-secondary" 
                    hx-get="/card?type=text&size=fs-2">
                + Nagłówek H2
            </button>

            <button type="button" class="btn btn-outline-secondary" 
                    hx-get="/card?type=text&size=fs-4">
                + Nagłówek H4
            </button>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success btn-lg">Zapisz cały trening</button>
        </div>
    </form>

</body>

</html>
