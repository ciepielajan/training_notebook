<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trening App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org"></script>

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2">
</head>

<body>

    {% include "_sidebar.html" %}

    <main class="main-content">

        <div class="mb-4 p-3 border rounded bg-white shadow-sm">
            <h5>Wczytaj trening</h5>
            <form hx-post="/load" hx-target="#fields-container" hx-swap="innerHTML" enctype="multipart/form-data">
                <div class="input-group">
                    <input type="file" class="form-control" name="file" accept=".json" required>
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-upload"></i> Wczytaj JSON
                    </button>
                </div>
            </form>
        </div>

        <hr>

        <form id="form" action="/save" method="post">
            <div id="fields-container" class="container node px-0">
                {% for card in cards_list %}
                {% with type=card.type, unique_id=card.unique_id, data=card.data, options=card.options %}
                {% include "_card.html" %}
                {% endwith %}
                {% endfor %}
            </div>

            <input type="hidden" name="json_body" id="hidden-json-input">

            <div class="mt-4 mb-5">
                <button type="submit" class="btn btn-success btn-lg">Zapisz cały trening</button>
            </div>
        </form>

    </main>

    <script src="{{ url_for('static', path='main.js') }}?v=1"></script>

</body>

</html>
