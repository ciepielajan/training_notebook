{# <div style="background: red; color: white; font-size: 10px; padding: 2px;">
    CARD WIDZI: {{ options }}
</div> #}


<div class="card mb-3 position-relative overflow-hidden" id="{{ unique_id }}">
    <input type="hidden" name="id" value="{{ unique_id }}">

    <div class="position-absolute start-0 top-0 h-100 d-flex flex-column justify-content-center ps-2" >
    
    <div class="dropdown">
        <button class="btn btn-sm btn-link text-secondary text-decoration-none p-0" 
                type="button" 
                data-bs-toggle="dropdown" 
                aria-expanded="false"
                style="width: 30px; height: 30px;"
                data-bs-popper-config='{"strategy":"fixed"}'>
            <i class="bi bi-plus-circle fs-4"></i>
        </button>

        <ul class="dropdown-menu shadow" hx-target="closest .card" hx-swap="afterend" style="z-index: 1000;">
            
            <li><h6 class="dropdown-header">Dodaj poniżej:</h6></li>

            <li>
                <button class="dropdown-item" type="button" hx-get="/card?type=running&value=Sprint&label=aktywnosc">
                    <i class="bi bi-stopwatch me-2"></i>Bieganie
                </button>
            </li>

            <li>
                <button class="dropdown-item" type="button" hx-get="/card?type=exercise&label=ćwiczenie">
                    <i class="bi bi-activity me-2"></i>Ćwiczenie
                </button>
            </li>

            <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=gym">
                    <i class="bi bi-hdd-stack me-2"></i>Siłownia
                </button>
            </li>

            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header">Tekst:</h6></li>

            <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=text&size=fs-1 fw-bold">
                    <i class="bi bi-type-h1 me-2"></i>Nagłówek H1
                </button>
            </li>

            <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=text&size=fs-2 fw-bold">
                    <i class="bi bi-type-h2 me-2"></i>Nagłówek H2
                </button>
            </li>
             <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=text&size=fs-3 fw-bold">
                    <i class="bi bi-type-h3 me-2"></i>Nagłówek H3
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=text&size=fs-4 fw-bold">
                    <i class="bi bi-type-h4 me-2"></i>Nagłówek H4
                </button>
            </li>
            <li>
                <button class="dropdown-item" type="button" 
                        hx-get="/card?type=text&size=fs-6">
                    <i class="bi bi-type me-2"></i>tekst
                </button>
            </li>
            <li><hr class="dropdown-divider"></li>
             <li>
                <button class="dropdown-item text-danger" type="button" 
                        onclick="this.closest('.card').remove()">
                    <i class="bi bi-trash me-2"></i>Usuń tę kartę
                </button>
            </li>
        </ul>
    </div>
</div>
    <div class="card-body ps-5">
        <div class="scroll-container">
            <table class="table mb-0">
                <tr id="row-{{ unique_id }}">
                    <td>
                        {% with data=data, options=options %}
                            {% include "exercises/" ~ type ~ ".html" %}
                        {% endwith %}
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
