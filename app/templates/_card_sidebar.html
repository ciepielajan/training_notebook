<div class="action-sidebar ps-1">
    <div class="card-selection-checkbox w-100 h-100" style="display: none;">
        <input class="form-check-input fs-5 m-0 card-select-cb cursor-pointer border-secondary" 
               type="checkbox" id="cb-{{ unique_id }}" value="{{ unique_id }}">
    </div>

    <div class="card-controls d-flex flex-row gap-1">
        <div class="dropdown">
            <button class="btn btn-sm btn-link text-secondary text-decoration-none p-0 d-flex align-items-center justify-content-center"
                type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 30px; height: 30px;"
                data-bs-popper-config='{"strategy":"fixed"}' title="{{ block_name }}">
                <i class="bi bi-plus-lg fs-5"></i>
            </button>

            <ul class="dropdown-menu shadow" hx-target="closest .exercise-row" hx-swap="afterend" style="z-index: 1000;">
                <li><h6 class="dropdown-header">Dodaj:</h6></li>
                <li><button class="dropdown-item fw-bold text-primary" type="button" hx-get="/card?type=metadata"><i class="bi bi-card-heading me-2"></i>Panel: Metadane</button></li>
                <li><button class="dropdown-item" type="button" hx-get="/card?type=table"><i class="bi bi-table me-2"></i>Ćwiczenie</button></li>
                <li><hr class="dropdown-divider"></li>
                <li><h6 class="dropdown-header">Tekst:</h6></li>
                <li><button class="dropdown-item" type="button" hx-get="/card?type=notes"><i class="bi bi-justify me-2"></i>Tekst</button></li>
                <li><button class="dropdown-item" type="button" hx-get="/card?type=text&size=fs-4 fw-bold"><i class="bi bi-type-h1 me-2"></i>Nagłówek</button></li>
                <li><button class="dropdown-item" type="button" hx-get="/card?type=list&list_type=bullet"><i class="bi bi-list-ul me-2"></i>Lista</button></li>
                <li><button class="dropdown-item" type="button" hx-get="/card?type=list&list_type=checklist"><i class="bi bi-ui-checks me-2"></i>Lista zadań (Checklista)</button></li>
            </ul>
        </div>

        <div class="dropdown">
            <button class="btn btn-sm btn-link text-secondary text-decoration-none p-0 d-flex align-items-center justify-content-center"
                type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 30px; height: 30px;"
                data-bs-popper-config='{"strategy":"fixed"}' title="Opcje wiersza">
                <i class="bi bi-three-dots-vertical fs-5"></i>
            </button>

            <ul class="dropdown-menu shadow" style="z-index: 1000;">
                <li>
                    <button class="dropdown-item fw-bold" type="button" onclick="toggleSelectionMode('{{ unique_id }}')">
                        <i class="bi bi-check2-square me-2"></i>Zaznacz element
                    </button>
                </li>
                <li>
                    <button class="dropdown-item fw-bold text-warning" type="button"
                        hx-post="/card/to_clipboard/{{ unique_id }}" hx-target="closest .exercise-row" hx-swap="outerHTML">
                        <i class="bi bi-scissors me-2"></i>Wytnij element
                    </button>
                </li>
                <li>
                    <button class="dropdown-item fw-bold text-success" type="button"
                        hx-post="/card/to_clipboard/{{ unique_id }}" hx-swap="none">
                        <i class="bi bi-copy me-2"></i>Kopiuj element
                    </button>
                </li>
                <li>
                    <button class="dropdown-item fw-bold text-info" type="button" hx-post="/card/paste/{{ unique_id }}"
                        hx-target="closest .exercise-row" hx-swap="afterend">
                        <i class="bi bi-clipboard-plus me-2"></i>Wklej (poniżej)
                    </button>
                </li>
                <li>
                    <button class="dropdown-item text-danger" type="button"
                        onclick="this.closest('.exercise-row').remove()">
                        <i class="bi bi-trash me-2"></i>Usuń
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
