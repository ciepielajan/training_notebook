<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test styli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=1">
    <!-- HTMX (CDN) - bardzo mała biblioteka -->
    <script src="https://unpkg.com/htmx.org"></script>
</head>

<body>
    <form id="form" action="/save" method="post">
        <div id="fields"></div>

        <button type="button" hx-post="/add-input/text" hx-target="#fields" hx-swap="beforeend">+ text</button>
        <button type="button" hx-post="/add-input/number" hx-target="#fields" hx-swap="beforeend">+ number</button>

        <button type="submit">Zapisz</button>
    </form>

    <!-- Wczytywanie -->
    <form hx-post="/load" hx-target="#fields" hx-swap="innerHTML" enctype="multipart/form-data">
        <input type="file" name="file" accept=".json">
        <button type="submit">Wczytaj</button>
    </form>


</body>

</html>
